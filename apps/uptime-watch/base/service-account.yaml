# The pods' identity in Google Cloud (Workload Identity Federation for GKE).
# IAM grants roles straight to this Kubernetes service account, e.g.
# roles/cloudsql.client for the Cloud SQL Auth Proxy, so no key files exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptime-watch
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
