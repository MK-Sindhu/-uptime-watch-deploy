# Secrets are never committed. They live in Google Secret Manager; External
# Secrets copies them into the Kubernetes Secret "uptime-watch" and refreshes
# it every hour.
#
# The SecretStore authenticates as the External Secrets controller's own
# Kubernetes service account (Workload Identity Federation for GKE), which IAM
# allows to read secrets (roles/secretmanager.secretAccessor).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: set-in-overlay
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-watch
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: uptime-watch
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .jwtSecret }}"
        # postgresql://USER:PASSWORD@127.0.0.1:5432/DB, through the proxy sidecar
        DATABASE_URL: "{{ .databaseUrl }}"
        REDIS_URL: "redis://:{{ .redisAuth }}@{{ .redisHost }}:6379"
        # For KEDA's Redis Streams scaler (workers.yaml)
        REDIS_ADDRESS: "{{ .redisHost }}:6379"
        REDIS_PASSWORD: "{{ .redisAuth }}"
        CLICKHOUSE_URL: "{{ .clickhouseUrl }}"
        CLICKHOUSE_PASSWORD: "{{ .clickhousePassword }}"
  data:
    - secretKey: jwtSecret
      remoteRef:
        key: uptime-watch-jwt-secret
    - secretKey: databaseUrl
      remoteRef:
        key: uptime-watch-database-url
    - secretKey: redisHost
      remoteRef:
        key: uptime-watch-redis-host
    - secretKey: redisAuth
      remoteRef:
        key: uptime-watch-redis-auth
    - secretKey: clickhouseUrl
      remoteRef:
        key: uptime-watch-clickhouse-url
    - secretKey: clickhousePassword
      remoteRef:
        key: uptime-watch-clickhouse-password
